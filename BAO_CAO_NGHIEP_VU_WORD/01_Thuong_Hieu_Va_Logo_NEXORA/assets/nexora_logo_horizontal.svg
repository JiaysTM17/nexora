<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Gradients for the dynamic X Nexus mark -->
    <linearGradient id="nexoraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="nexoraGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="nexoraGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    
    <!-- Subtle drop shadow for premium depth on pure white -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Pure White Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- LOGO MARK: THE NEXUS 'X' (Left Side) -->
  <g transform="translate(40, 20)" filter="url(#softShadow)">
    <!-- Arm 1: Top-Left to Bottom-Right Flowing Ribbon -->
    <path d="M 45,35 
             C 65,35 95,65 115,100 
             C 135,135 155,165 175,165 
             C 190,165 195,150 185,135 
             C 170,115 145,85 125,55 
             C 105,25 75,15 45,20 
             C 30,22 25,35 45,35 Z" 
          fill="url(#nexoraGrad1)" />

    <!-- Arm 2: Top-Right to Bottom-Left Interlocking Loop -->
    <path d="M 155,35 
             C 135,35 105,65 85,100 
             C 65,135 45,165 25,165 
             C 10,165 5,150 15,135 
             C 30,115 55,85 75,55 
             C 95,25 125,15 155,20 
             C 170,22 175,35 155,35 Z" 
          fill="url(#nexoraGrad2)" />

    <!-- Core Nexus Intersection Bridge: Creates the overlapping ribbon depth -->
    <path d="M 85,85 
             C 95,72 105,72 115,85 
             C 125,98 120,112 110,120 
             C 100,128 90,125 80,115 
             C 75,105 78,95 85,85 Z" 
          fill="url(#nexoraGradAccent)" 
          opacity="0.95" />

    <!-- Central Focus Spark / Node: Representing the convergence point -->
    <circle cx="100" cy="100" r="14" fill="#FFFFFF" />
    <circle cx="100" cy="100" r="9" fill="url(#nexoraGrad1)" />
  </g>

  <!-- TYPOGRAPHY: 'NEXORA' (Right Side) -->
  <g transform="translate(280, 138)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#0F172A">
      NEX<tspan fill="url(#nexoraGrad1)">O</tspan>RA
    </text>
    
    <!-- Tagline -->
    <text x="5" y="44" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="19" 
          font-weight="600" 
          letter-spacing="7" 
          fill="#64748B">
      NEXT-GEN TECH COMMERCE
    </text>
  </g>
</svg>