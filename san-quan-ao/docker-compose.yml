services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mac
      POSTGRES_PASSWORD: mac_local_only
      POSTGRES_DB: mac
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mac -d mac"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:63799:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mac_local
      MINIO_ROOT_PASSWORD: mac_local_only_secret
    ports: ["127.0.0.1:9009:9000", "127.0.0.1:9010:9001"]
    volumes: ["media_data:/data"]
volumes:
  postgres_data:
  media_data:
