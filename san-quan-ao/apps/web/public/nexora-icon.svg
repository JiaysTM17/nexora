<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand gradients -->
    <linearGradient id="iconXGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#253C32" />
      <stop offset="100%" stop-color="#4F7162" />
    </linearGradient>

    <linearGradient id="iconXGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A15B43" />
      <stop offset="100%" stop-color="#253C32" />
    </linearGradient>

    <filter id="iconSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#253C32" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Transparent Background (No White Base/Squircle) -->

  <!-- HERO 'X' INTERLOCKING GLYPH -->
  <g transform="translate(64, 64)" filter="url(#iconSoftShadow)">
    <!-- Primary Loop 1: Top-Left to Bottom-Right -->
    <path d="M 80,60 
             C 130,60 210,135 260,210 
             C 300,270 340,340 340,340 
             C 360,365 335,390 310,370 
             C 260,340 185,255 130,185 
             C 90,135 50,90 50,60 
             C 50,45 65,60 80,60 Z" 
          fill="url(#iconXGrad1)" />

    <!-- Complementary Loop 2: Top-Right to Bottom-Left -->
    <path d="M 340,60 
             C 290,60 210,135 160,210 
             C 120,270 80,340 80,340 
             C 60,365 85,390 110,370 
             C 160,340 235,255 290,185 
             C 330,135 370,90 370,60 
             C 370,45 355,60 340,60 Z" 
          fill="url(#iconXGrad2)" />

    <!-- Core Nexus Intersection Spark -->
    <circle cx="210" cy="215" r="28" fill="none" stroke="#253C32" stroke-width="8" />
    <circle cx="210" cy="215" r="14" fill="#A15B43" />
  </g>
</svg>