<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <defs>
    <filter id="shadow-trang" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4a5048" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="200" height="250" fill="#edf0ec"/>
  <!-- Floor shadow -->
  <ellipse cx="100" cy="226" rx="55" ry="8" fill="#3c423a" opacity="0.05"/>
  <!-- Main Shirt Body -->
  <g filter="url(#shadow-trang)">
    <!-- Base Shirt Shape -->
    <path d="M86 42 Q100 38 114 42 L162 58 L178 108 L158 114 L144 96 L146 212 Q100 224 54 212 L56 96 L42 114 L22 108 L38 58 Z" fill="#f5f4ee" stroke="#c5c8c0" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Sleeve Cuff Seams -->
    <path d="M25 102 L41 108" stroke="#c5c8c0" stroke-width="0.9" fill="none"/>
    <path d="M175 102 L159 108" stroke="#c5c8c0" stroke-width="0.9" fill="none"/>
    <!-- Center Placket -->
    <path d="M96 58 H104 V218 H96 Z" fill="#ffffff" stroke="#c5c8c0" stroke-width="0.8"/>
    <!-- Left Collar -->
    <path d="M86 42 L100 58 L91 76 L78 54 Z" fill="#ffffff" stroke="#c5c8c0" stroke-width="1" stroke-linejoin="round"/>
    <!-- Right Collar -->
    <path d="M114 42 L100 58 L109 76 L122 54 Z" fill="#ffffff" stroke="#c5c8c0" stroke-width="1" stroke-linejoin="round"/>
    <!-- Chest Pocket -->
    <path d="M116 102 H134 V120 Q125 125 116 120 Z" fill="none" stroke="#c5c8c0" stroke-width="0.9"/>
    <!-- Inner collar line -->
    <path d="M89 43 Q100 48 111 43" fill="none" stroke="#b0b3ab" stroke-width="0.8"/>
    <!-- Buttons -->
    <circle cx="100" cy="74" r="1.5" fill="#9a9d95"/>
    <circle cx="100" cy="102" r="1.5" fill="#9a9d95"/>
    <circle cx="100" cy="130" r="1.5" fill="#9a9d95"/>
    <circle cx="100" cy="158" r="1.5" fill="#9a9d95"/>
    <circle cx="100" cy="186" r="1.5" fill="#9a9d95"/>
    <circle cx="100" cy="210" r="1.5" fill="#9a9d95"/>
    <!-- Bottom Hem Accent -->
    <path d="M57 207 Q100 219 143 207" fill="none" stroke="#dbded7" stroke-width="0.7"/>
  </g>
</svg>
