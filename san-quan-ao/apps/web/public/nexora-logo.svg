<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8C98A"/>
      <stop offset="100%" stop-color="#A67C4E"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A67C4E"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
  </defs>

  <!-- N mark - luxury fashion monogram style -->
  <g transform="translate(28, 24)">
    <!-- Outer diamond frame -->
    <polygon points="66,4 128,36 128,100 66,132 4,100 4,36" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- Inner N letterform -->
    <text x="66" y="100" font-family="Georgia,'Times New Roman',serif" font-size="78" font-weight="400" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">N</text>
    <!-- Corner accent dots -->
    <circle cx="66" cy="4" r="2.8" fill="url(#goldGrad)"/>
    <circle cx="66" cy="132" r="2.8" fill="url(#goldGrad)"/>
    <circle cx="128" cy="68" r="2.8" fill="url(#goldGrad)"/>
    <circle cx="4" cy="68" r="2.8" fill="url(#goldGrad)"/>
  </g>

  <!-- NEXORA wordmark -->
  <g transform="translate(178, 50)">
    <text font-family="Georgia,'Times New Roman',serif" font-size="72" font-weight="400" letter-spacing="6" fill="#1a1a1a">NEXORA</text>
    <!-- Thin gold rule under wordmark -->
    <line x1="0" y1="18" x2="430" y2="18" stroke="url(#goldStroke)" stroke-width="1"/>
    <!-- Tagline -->
    <text x="1" y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="5.5" fill="#8a7560">FASHION &amp; LIFESTYLE</text>
  </g>
</svg>
