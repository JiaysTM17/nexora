<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Gradients for the dynamic X Nexus mark matching brand aesthetics -->
    <linearGradient id="nexoraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#253C32" />
      <stop offset="100%" stop-color="#4F7162" />
    </linearGradient>
    <linearGradient id="nexoraGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A15B43" />
      <stop offset="100%" stop-color="#253C32" />
    </linearGradient>
    <linearGradient id="nexoraGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A15B43" />
      <stop offset="50%" stop-color="#C27A60" />
      <stop offset="100%" stop-color="#253C32" />
    </linearGradient>
    
    <!-- Soft shadow with transparent blend -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#253C32" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Transparent Background (No White Fill) -->

  <!-- LOGO MARK: THE NEXUS 'X' (Left Side) -->
  <g transform="translate(40, 20)" filter="url(#softShadow)">
    <!-- Arm 1: Top-Left to Bottom-Right Flowing Ribbon -->
    <path d="M 45,35 
             C 65,35 95,65 115,100 
             C 135,135 155,165 175,165 
             C 190,165 195,150 185,135 
             C 170,115 145,85 125,55 
             C 105,25 75,15 45,20 
             C 30,22 25,35 45,35 Z" 
          fill="url(#nexoraGrad1)" />

    <!-- Arm 2: Top-Right to Bottom-Left Interlocking Loop -->
    <path d="M 155,35 
             C 135,35 105,65 85,100 
             C 65,135 45,165 25,165 
             C 10,165 5,150 15,135 
             C 30,115 55,85 75,55 
             C 95,25 125,15 155,20 
             C 170,22 175,35 155,35 Z" 
          fill="url(#nexoraGrad2)" />

    <!-- Core Nexus Intersection Bridge -->
    <path d="M 85,85 
             C 95,72 105,72 115,85 
             C 125,98 120,112 110,120 
             C 100,128 90,125 80,115 
             C 75,105 78,95 85,85 Z" 
          fill="url(#nexoraGradAccent)" 
          opacity="0.95" />

    <!-- Central Focus Spark / Node: Ring structure with clear center -->
    <circle cx="100" cy="100" r="14" fill="none" stroke="#253C32" stroke-width="4" />
    <circle cx="100" cy="100" r="7" fill="url(#nexoraGradAccent)" />
  </g>

  <!-- TYPOGRAPHY: 'NEXORA' (Right Side) -->
  <g transform="translate(280, 138)">
    <text font-family="Georgia, 'Times New Roman', serif" 
          font-size="84" 
          font-weight="bold" 
          letter-spacing="4" 
          fill="#253C32">
      NEX<tspan fill="#A15B43">O</tspan>RA
    </text>
    
    <!-- Tagline: High-end Fashion Aesthetic -->
    <text x="6" y="44" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="6" 
          fill="#777E73">
      TECH COMMERCE &amp; OOTD
    </text>
  </g>
</svg>