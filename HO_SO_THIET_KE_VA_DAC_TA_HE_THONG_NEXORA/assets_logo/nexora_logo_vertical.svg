<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="vGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="vGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="vShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Pure White Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- HERO GLYPH CENTERED TOP -->
  <g transform="translate(190, 70)" filter="url(#vShadow)">
    <path d="M 45,30 C 70,30 115,75 140,115 C 160,150 180,185 200,185 C 215,185 220,170 210,150 C 190,125 160,90 135,55 C 110,25 80,10 45,15 C 30,17 25,30 45,30 Z" fill="url(#vGrad1)" />
    <path d="M 175,30 C 150,30 105,75 80,115 C 60,150 40,185 20,185 C 5,185 0,170 10,150 C 30,125 60,90 85,55 C 110,25 140,10 175,15 C 190,17 195,30 175,30 Z" fill="url(#vGrad2)" />
    <circle cx="110" cy="100" r="18" fill="#FFFFFF" />
    <circle cx="110" cy="100" r="12" fill="url(#vGrad1)" />
    <circle cx="110" cy="100" r="5" fill="#FFFFFF" />
  </g>

  <!-- CENTERED TYPOGRAPHY -->
  <g transform="translate(300, 390)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="6" fill="#0F172A">
      NEX<tspan fill="url(#vGrad1)">O</tspan>RA
    </text>
    
    <text text-anchor="middle" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="8" fill="#64748B">
      NEXT-GEN TECH COMMERCE
    </text>

    <!-- Visual divider line -->
    <line x1="-120" y1="80" x2="120" y2="80" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Core Value Pillars -->
    <text text-anchor="middle" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#94A3B8">
      HARDWARE • TRADE-IN • OMNICHANNEL
    </text>
  </g>
</svg>